services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: central_product
      POSTGRES_USER: central
      POSTGRES_PASSWORD: central
    ports:
      - "5432:5432"
    volumes:
      - central_product_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central -d central_product"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  central_product_pgdata: